<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="zunmeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1238"/>
      <stop offset="50%" stop-color="#4A2368"/>
      <stop offset="100%" stop-color="#6E56CF"/>
    </linearGradient>

    <!-- Z Neon Cyber-Gradient -->
    <linearGradient id="zunmeZ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="45%" stop-color="#D946EF"/>
      <stop offset="85%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- AI Sparkle Gradient -->
    <linearGradient id="zunmeSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="zunmeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="48" height="48" rx="14" fill="url(#zunmeBg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="13.25" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Modern Geometric 'Z' Monogram -->
  <!-- Upper horizontal beam with angled terminal -->
  <path d="M12 14.5C12 13.67 12.67 13 13.5 13H33.5C34.6 13 35.3 14.18 34.75 15.13L21.2 31.5H34.5C35.33 31.5 36 32.17 36 33C36 33.83 35.33 34.5 34.5 34.5H14.5C13.4 34.5 12.7 33.32 13.25 32.37L26.8 16H13.5C12.67 16 12 15.33 12 14.5Z" 
        fill="url(#zunmeZ)" 
        filter="url(#zunmeGlow)"/>

  <!-- AI Intelligence Core Sparkle (Top-Right of Z) -->
  <path d="M36 10C36 12 37.5 13.5 39.5 13.5C37.5 13.5 36 15 36 17C36 15 34.5 13.5 32.5 13.5C34.5 13.5 36 12 36 10Z" fill="url(#zunmeSpark)"/>

  <!-- Small AI Node (Bottom-Left) -->
  <circle cx="11.5" cy="35.5" r="2" fill="#06B6D4" opacity="0.9"/>
</svg>
